type: model
name: pmt_req
label: Payment requests
sql_from: public.pmt_req
primary_key: pr_id
dimensions:
  - name: pr_id
    type: number
    sql: ${TABLE}.pr_id
    metrics:
      request_count:
        type: count_distinct
      succeeded_request_count:
        type: count_distinct
        filters:
          - sts_cd: S
  - name: sts_cd
    type: string
    sql: ${TABLE}.sts_cd
