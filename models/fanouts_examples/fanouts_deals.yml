version: 2
models:
  - name: fanouts_deals
    description: "CRM deals with pipeline value metrics. Note: region/territory breakdown is not yet available — the upstream deals_raw source does not include a region column, and there is no join key linking deals to regional_sales. To enable pipeline-by-region analysis, add a region or territory field to the deals_raw source and surface it here."
    meta:
      required_attributes:
        is_admin_saas_demo: "true"
      primary_key: deal_id
      ai_hint:
        - Use this explore to analyse deal pipeline value, deal counts, and deal stages.
        - Region or territory breakdown is not currently available in this explore. The upstream deals_raw source does not contain a region column, and there is no shared key with regional_sales. Do not attempt to join regional_sales here — the models are unrelated. To support pipeline-by-region queries, a region field must be added to the upstream deals_raw data source.
    columns:
      - name: deal_id
        description: "Unique identifier for this deal"
        meta:
          dimension:
            type: string
          metrics:
            unique_deal_count:
              type: count_distinct
              label: "✅ FANOUT SAFE Unique Deal Count"
              description: "✅ CORRECT: Count distinct deals"

            inflated_deal_count:
              type: count
              label: "🚨 INFLATED Deal Count"
              description:
                "❌ WRONG: Each deal gets multiplied by (users × events) in that
                account"

      - name: account_id
        description: "Links to the account table"
        meta:
          dimension:
            type: string

      - name: stage
        description: "Current stage of the deal"
        meta:
          dimension:
            type: string

      - name: amount
        description: "Deal value in dollars"
        meta:
          dimension:
            type: number
          metrics:
            total_deal_value:
              label: "Total Deal Value"
              format: "usd"
              type: sum

            average_deal_value:
              type: average
              format: "usd"

            max_deal_value:
              type: max
              label: "✅ FANOUT SAFE Max Deal Value"
              description: "Maximum deal value in the dataset"
              format: "usd"

            min_deal_value:
              type: max
              label: "✅ FANOUT SAFE Min Deal Value"
              description: "Minimum deal value in the dataset"
              format: "usd"

            median_deal_value:
              type: median
              label: "🚨 INFLATED Median Deal Value"
              description: "Median deal value in the dataset"
              format: "usd"

      - name: created_date
        description: "When the deal was created"
        meta:
          dimension:
            type: date
      - name: plan
        description: ""
        meta:
          dimension:
            type: string
      - name: seats
        description: ""
        meta:
          dimension:
            type: number
