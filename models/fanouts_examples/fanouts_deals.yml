version: 2
models:
  - name: fanouts_deals
    description: |
      CRM pipeline deals, analogous to Salesforce Opportunities. Each row is one
      deal with its stage (e.g. Prospecting, Qualified, Won, Lost), monetary value
      (amount), and the account it belongs to. Use this model to answer questions
      about pipeline value, deal count, win rate, or deal stage — such as
      "total pipeline value this quarter" or "average deal size by stage".

      Note: this model does not contain a region or territory dimension. Deal-level
      region breakdowns are not available in the current data; that would require
      adding a region field to the upstream CRM source (deals_raw or accounts_raw).
      The regional_sales model covers geographic revenue but represents retail
      product sales, not CRM pipeline.
    meta:
      required_attributes:
        is_admin_saas_demo: "true"
      primary_key: deal_id
    columns:
      - name: deal_id
        description: "Unique identifier for this deal"
        meta:
          dimension:
            type: string
          metrics:
            unique_deal_count:
              type: count_distinct
              label: "✅ FANOUT SAFE Unique Deal Count"
              description: "✅ CORRECT: Count distinct deals"

            inflated_deal_count:
              type: count
              label: "🚨 INFLATED Deal Count"
              description:
                "❌ WRONG: Each deal gets multiplied by (users × events) in that
                account"

      - name: account_id
        description: "Links to the account table"
        meta:
          dimension:
            type: string

      - name: stage
        description: "Current stage of the deal"
        meta:
          dimension:
            type: string

      - name: amount
        description: "Deal value in dollars"
        meta:
          dimension:
            type: number
          metrics:
            total_deal_value:
              label: "Total Deal Value"
              format: "usd"
              type: sum

            average_deal_value:
              type: average
              format: "usd"

            max_deal_value:
              type: max
              label: "✅ FANOUT SAFE Max Deal Value"
              description: "Maximum deal value in the dataset"
              format: "usd"

            min_deal_value:
              type: max
              label: "✅ FANOUT SAFE Min Deal Value"
              description: "Minimum deal value in the dataset"
              format: "usd"

            median_deal_value:
              type: median
              label: "🚨 INFLATED Median Deal Value"
              description: "Median deal value in the dataset"
              format: "usd"

      - name: created_date
        description: "When the deal was created"
        meta:
          dimension:
            type: date
      - name: plan
        description: ""
        meta:
          dimension:
            type: string
      - name: seats
        description: ""
        meta:
          dimension:
            type: number
