version: 2
models:
  - name: fanouts_deals
    description: >
      Pipeline deals data. Note: a region/territory dimension is not yet exposed on this model.
      The upstream warehouse tables (fanouts_deals and fanouts_accounts) do not currently include
      a region or territory column, and no territory lookup table keyed on account_id exists in
      the warehouse. To expose region on deals, the data engineering team must first enrich
      fanouts_accounts or fanouts_deals with a region column (e.g. from Salesforce account
      territory or billing region), or create a territory/region lookup table keyed on account_id.
      Once that upstream data is available, a region dimension and/or join can be added here with
      a trivial YAML change.
    meta:
      required_attributes:
        is_admin_saas_demo: "true"
      primary_key: deal_id
    columns:
      - name: deal_id
        description: "Unique identifier for this deal"
        meta:
          dimension:
            type: string
          metrics:
            unique_deal_count:
              type: count_distinct
              label: "✅ FANOUT SAFE Unique Deal Count"
              description: "✅ CORRECT: Count distinct deals"

            inflated_deal_count:
              type: count
              label: "🚨 INFLATED Deal Count"
              description:
                "❌ WRONG: Each deal gets multiplied by (users × events) in that
                account"

      - name: account_id
        description: "Links to the account table"
        meta:
          dimension:
            type: string

      - name: stage
        description: "Current stage of the deal"
        meta:
          dimension:
            type: string

      - name: amount
        description: "Deal value in dollars"
        meta:
          dimension:
            type: number
          metrics:
            total_deal_value:
              label: "Total Deal Value"
              format: "usd"
              type: sum

            average_deal_value:
              type: average
              format: "usd"

            max_deal_value:
              type: max
              label: "✅ FANOUT SAFE Max Deal Value"
              description: "Maximum deal value in the dataset"
              format: "usd"

            min_deal_value:
              type: max
              label: "✅ FANOUT SAFE Min Deal Value"
              description: "Minimum deal value in the dataset"
              format: "usd"

            median_deal_value:
              type: median
              label: "🚨 INFLATED Median Deal Value"
              description: "Median deal value in the dataset"
              format: "usd"

      - name: created_date
        description: "When the deal was created"
        meta:
          dimension:
            type: date
      - name: plan
        description: ""
        meta:
          dimension:
            type: string
      - name: seats
        description: ""
        meta:
          dimension:
            type: number

